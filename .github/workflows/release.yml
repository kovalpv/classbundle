name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Extract version from tag
        run: |
          VERSION="${RELEASE_VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building plugin version: ${VERSION}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion="${{ env.RELEASE_VERSION }}" --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin -PpluginVersion="${{ env.RELEASE_VERSION }}" --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Class Bundle v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: build/distributions/*
          generate_release_notes: true
          body: |
            ## Class Bundle v${{ env.RELEASE_VERSION }}

            ### Установка
            1. Скачать `classbundle-${{ env.RELEASE_VERSION }}.zip`
            2. IntelliJ IDEA → Settings → Plugins → ⚙️ → *Install Plugin from Disk…*
            3. Выбрать скачанный ZIP и перезапустить IDE

            <details>
            <summary>Build info</summary>

            - Commit: ${{ github.sha }}
            - Date: ${{ github.event.head_commit.date }}
            - Runner: ${{ runner.os }}

            </details>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
