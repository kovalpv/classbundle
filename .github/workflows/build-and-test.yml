name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: classbundle-plugin
          path: build/distributions
          retention-days: 30
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-SNAPSHOT
          draft: true
          prerelease: true
          files: build/distributions/*
          body: |
            **Auto-built from** [`${{ github.sha }}`](https://github.com/kovalpv/classbundle/commit/${{ github.sha }})

            <details>
            <summary>Build info</summary>

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Trigger: ${{ github.event_name }}
            - Date: ${{ github.event.head_commit.date }}

            </details>

            ### Установка
            1. Скачать `classbundle-0.1.1-SNAPSHOT.zip`
            2. IntelliJ IDEA → Settings → Plugins → ⚙️ → *Install Plugin from Disk…*
            3. Выбрать скачанный ZIP и перезапустить IDE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

